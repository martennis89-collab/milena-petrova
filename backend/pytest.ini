[pytest]
# Put the backend package root on sys.path so tests can import `utils`,
# `config` and `routes` the same way the application does.
pythonpath = .
testpaths = tests
python_files = test_*.py

# Integration tests need a live API and database, so they are opt-in.
# Run them with:  pytest -m integration  (REACT_APP_BACKEND_URL must be set)
addopts = -m "not integration"

markers =
    integration: requires a running API and a reachable database (set REACT_APP_BACKEND_URL)
