server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compress text responses; images and the PDF are already compressed.
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Hashed filenames from the build can be cached indefinitely.
    location /static/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns the URL space: every unknown path must return index.html
    # so a deep link such as /lubov-bez-bolka works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients keep loading a stale
    # bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
